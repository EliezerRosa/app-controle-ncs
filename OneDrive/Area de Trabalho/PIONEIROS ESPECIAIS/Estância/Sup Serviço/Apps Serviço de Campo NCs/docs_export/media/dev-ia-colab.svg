<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none">
  <style>
    .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .chip { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
  </style>
  <rect width="720" height="360" rx="24" fill="#f8fafc"/>
  <text x="360" y="46" text-anchor="middle" class="title">Colaboração Humano + GPT-5 Codex</text>

  <rect x="72" y="96" width="220" height="180" rx="18" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="182" y="130" text-anchor="middle" class="label">Dev Líder</text>
  <text x="182" y="156" text-anchor="middle" class="body">Define objetivos, critérios</text>
  <text x="182" y="176" text-anchor="middle" class="body">Revisa mudanças críticas</text>
  <text x="182" y="196" text-anchor="middle" class="body">Decide releases/rollback</text>
  <rect x="110" y="214" width="144" height="30" rx="15" fill="#bae6fd"/>
  <text x="182" y="235" text-anchor="middle" class="chip">Intenção · Riscos · Aprovação</text>

  <rect x="430" y="96" width="220" height="180" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="540" y="130" text-anchor="middle" class="label">Agente GPT-5 Codex</text>
  <text x="540" y="156" text-anchor="middle" class="body">Planeja ações no workspace</text>
  <text x="540" y="176" text-anchor="middle" class="body">Edita código e documentação</text>
  <text x="540" y="196" text-anchor="middle" class="body">Executa diagnósticos/scripts</text>
  <rect x="468" y="214" width="144" height="30" rx="15" fill="#ddd6fe"/>
  <text x="540" y="235" text-anchor="middle" class="chip">Logs · Diffs · Sugestões</text>

  <path d="M292 186h116" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M428 210H312" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrowPurple)"/>

  <text x="350" y="172" class="body">Briefing / Critérios</text>
  <text x="370" y="232" class="body">Planos · Execução · Feedback</text>

  <rect x="250" y="278" width="220" height="46" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="306" text-anchor="middle" class="label">Deploy confiável + Documentação viva</text>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
